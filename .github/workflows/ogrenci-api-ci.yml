name: Ogrenci API CI

on:
  push:
    paths:
      - 'Backend/ogrenci-api/**'
      - '.github/workflows/ogrenci-api-ci.yml'
  pull_request:
    paths:
      - 'Backend/ogrenci-api/**'
      - '.github/workflows/ogrenci-api-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/ogrenci-api

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/ogrenci-api/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü ve testler
        run: npm run check
